<!doctype html>
<html><head><meta charset="utf-8"><title>decimate (temporary tool)</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
</head><body><pre id="log">starting…</pre>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
import { MeshoptSimplifier } from "https://cdn.jsdelivr.net/npm/meshoptimizer@0.22.0/meshopt_simplifier.module.js";

const log = (s) => { document.getElementById("log").textContent += "\n" + s; };
const params = new URLSearchParams(location.search);
const ratio = parseFloat(params.get("ratio") || "0.1");
const maxTex = parseInt(params.get("tex") || "1024", 10);

try {
  await MeshoptSimplifier.ready;
  MeshoptSimplifier.useExperimentalFeatures = true;
  const draco = new DRACOLoader().setDecoderPath("/draco/");
  const gltf = await new GLTFLoader().setDRACOLoader(draco).loadAsync("/models/iss_hd.glb");
  log("loaded");
  let before = 0, after = 0, meshes = 0;
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    meshes++;
    const g = o.geometry;
    const pos = g.attributes.position;
    const n = pos.count;
    before += n;
    if (n < 4000) { after += n; return; }
    const idx = g.index ? Uint32Array.from(g.index.array) : Uint32Array.from({ length: n }, (_, i) => i);
    const nrm = g.attributes.normal, uv = g.attributes.uv;
    const stride = 5;
    const attrs = new Float32Array(n * stride);
    const posArr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      posArr[i * 3] = pos.getX(i); posArr[i * 3 + 1] = pos.getY(i); posArr[i * 3 + 2] = pos.getZ(i);
      if (nrm) { attrs[i * stride] = nrm.getX(i); attrs[i * stride + 1] = nrm.getY(i); attrs[i * stride + 2] = nrm.getZ(i); }
      if (uv) { attrs[i * stride + 3] = uv.getX(i); attrs[i * stride + 4] = uv.getY(i); }
    }
    const target = Math.max(600, Math.floor((idx.length * ratio) / 3) * 3);
    const [simp] = MeshoptSimplifier.simplifyWithAttributes(idx, posArr, 3, attrs, stride, [0.6, 0.6, 0.6, 1, 1], null, target, 0.1, ["LockBorder"]);
    const remap = new Int32Array(n).fill(-1);
    let m = 0;
    for (let i = 0; i < simp.length; i++) if (remap[simp[i]] < 0) remap[simp[i]] = m++;
    const np = new Float32Array(m * 3), nn = nrm ? new Float32Array(m * 3) : null, nu = uv ? new Float32Array(m * 2) : null;
    for (let i = 0; i < n; i++) {
      const j = remap[i]; if (j < 0) continue;
      np[j * 3] = posArr[i * 3]; np[j * 3 + 1] = posArr[i * 3 + 1]; np[j * 3 + 2] = posArr[i * 3 + 2];
      if (nn) { nn[j * 3] = attrs[i * stride]; nn[j * 3 + 1] = attrs[i * stride + 1]; nn[j * 3 + 2] = attrs[i * stride + 2]; }
      if (nu) { nu[j * 2] = attrs[i * stride + 3]; nu[j * 2 + 1] = attrs[i * stride + 4]; }
    }
    const ni = new Uint32Array(simp.length);
    for (let i = 0; i < simp.length; i++) ni[i] = remap[simp[i]];
    const ng = new THREE.BufferGeometry();
    ng.setAttribute("position", new THREE.BufferAttribute(np, 3));
    if (nn) ng.setAttribute("normal", new THREE.BufferAttribute(nn, 3));
    if (nu) ng.setAttribute("uv", new THREE.BufferAttribute(nu, 2));
    ng.setIndex(new THREE.BufferAttribute(ni, 1));
    o.geometry.dispose();
    o.geometry = ng;
    after += m;
  });
  log(`meshes=${meshes} vertices ${before} -> ${after}`);
  const glb = await new GLTFExporter().parseAsync(gltf.scene, { binary: true, maxTextureSize: maxTex });
  log(`exported ${(glb.byteLength / 1048576).toFixed(1)} MB`);
  const res = await fetch("http://127.0.0.1:8765/", { method: "PUT", body: glb });
  log(`saved: ${res.status} ${await res.text()} bytes`);
  log("DONE");
} catch (e) { log("ERROR " + (e && e.stack || e)); }
</script></body></html>
